<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8efe9"/>
      <stop offset="50%" stop-color="#d4e2d7"/>
      <stop offset="100%" stop-color="#b8cec0"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e1d3"/>
      <stop offset="100%" stop-color="#eac8b5"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f5f2"/>
    </linearGradient>
    <linearGradient id="innerLapel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b5e50"/>
      <stop offset="100%" stop-color="#124036"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="480" fill="url(#avatarBg)"/>

  <!-- Soft Clinic Glow & Botanical Ambience -->
  <circle cx="200" cy="180" r="140" fill="#ffffff" opacity="0.35"/>
  <path d="M40 440 C80 380 120 400 160 480 Z" fill="#2d6a59" opacity="0.08"/>
  <path d="M360 440 C320 380 280 400 240 480 Z" fill="#2d6a59" opacity="0.08"/>

  <!-- TCM Symbol Watermark (和 - Harmony) -->
  <text x="200" y="90" font-family="'Noto Serif SC', serif" font-size="44" fill="#1b5e50" opacity="0.14" text-anchor="middle" font-weight="bold">和</text>

  <!-- Head & Hair Shadow -->
  <ellipse cx="200" cy="185" rx="55" ry="68" fill="url(#skinGrad)"/>

  <!-- Hair / Professional Grooming Silhouette -->
  <path d="M142 175 C140 120 165 95 200 95 C235 95 260 120 258 175 C255 155 245 130 200 130 C155 130 145 155 142 175 Z" fill="#2c2725"/>

  <!-- Neck -->
  <rect x="185" y="235" width="30" height="42" fill="#dfbfa9" rx="4"/>

  <!-- Inner Shirt (Deep Jade) -->
  <path d="M175 270 L200 315 L225 270 Z" fill="url(#innerLapel)"/>

  <!-- Clinical White Coat Shoulders -->
  <path d="M85 480 C90 350 140 270 185 270 L200 295 L215 270 C260 270 310 350 315 480 Z" fill="url(#coatGrad)"/>

  <!-- Coat Lapels -->
  <path d="M185 270 L160 380 L200 480 L200 295 Z" fill="#e2ede6" stroke="#c0d4c8" stroke-width="1.5"/>
  <path d="M215 270 L240 380 L200 480 L200 295 Z" fill="#f4faf6" stroke="#c0d4c8" stroke-width="1.5"/>

  <!-- Stethoscope / TCM Acupuncture Seal Pin -->
  <circle cx="165" cy="330" r="8" fill="#c49a45" stroke="#9a752a" stroke-width="1.5"/>
  <path d="M165 325 L165 335 M161 329 L169 331" stroke="#ffffff" stroke-width="1.2"/>

  <!-- Subtle Badge Text -->
  <rect x="110" y="420" width="180" height="32" rx="16" fill="rgba(255,255,255,0.85)" stroke="#1b5e50" stroke-width="1"/>
  <text x="200" y="441" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1b5e50" text-anchor="middle" letter-spacing="0.5">LICENSED PRACTITIONER</text>
</svg>
